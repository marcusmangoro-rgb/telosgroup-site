<!doctype html>
<html lang="en-GB" data-telos-click="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Opening the notice · Telos Group</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<!--
  Forwarding page for the tender links in the Monday email (26 Nov 2026; tendertip-alerts click_track.py).
  A link looks like /t/?k=<key>&d=<code>. k is an opaque 12-character key (no firm, name or address in it); d is a
  notice reference with a one-letter portal prefix. The notice URL is rebuilt from the fixed template for that
  letter, so this page can only forward to those three notice pages: there is no open redirect and no list of keys
  to publish. One GoatCounter event ("click/<key>", no cookies) is counted when JavaScript runs, then the page
  forwards at once. Link scanners that fetch the page without running JavaScript are not counted.
  Keep PORTALS identical to click_track.PORTALS (tests/test_click_tracking.py in tendertip-alerts compares them).
-->
<style>
  :root { --ink:#17202a; --body:#3b4654; --muted:#5d6877; --paper:#fff; --green:#1f7355; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink:#e9eef3; --body:#c3ccd6; --muted:#9aa6b4; --paper:#11171d; --green:#4cbf92; }
  }
  body { margin:0; background:var(--paper); color:var(--body); font:17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { color: var(--ink); font-size: 22px; margin: 0 0 12px; }
  a { color: var(--green); font-weight: 600; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1 id="h">Opening the tender notice&hellip;</h1>
  <p id="go" hidden>If nothing happens, <a id="link" href="/" rel="noreferrer">open the notice</a>.</p>
  <p id="bad" hidden>This link isn't complete. The tender's direct link is also in the plain-text version of the email,
    or reply to the email and we'll send it again.</p>
  <noscript>
    <p>Your browser has JavaScript turned off, so this page can't forward you. The tender's direct link is also in the
      plain-text version of the email, or reply to the email and we'll send it.</p>
  </noscript>
  <p class="muted"><a href="/">Telos Group</a> &middot; <a href="/privacy.html">How we use your details</a></p>
</main>
<script>
(function () {
  var PORTALS = {
    f: ['https://www.find-tender.service.gov.uk/Notice/', /^(?:\d{6}-\d{4})$/],
    c: ['https://www.contractsfinder.service.gov.uk/Notice/', /^(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/],
    s: ['https://www.publiccontractsscotland.gov.uk/search/show/search_view.aspx?ID=', /^(?:[A-Z]{3}\d{3,9})$/]
  };
  var COUNTER = 'https://telosgroup.goatcounter.com/count';

  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
    try { return m ? decodeURIComponent(m[1]) : ''; } catch (e) { return ''; }
  }
  function destination(code) {
    var p = Object.prototype.hasOwnProperty.call(PORTALS, code.charAt(0)) ? PORTALS[code.charAt(0)] : null;
    var ref = code.slice(1);
    return p && p[1].test(ref) ? p[0] + ref : '';
  }
  function looksAutomated() {
    var ua = navigator.userAgent || '';
    return navigator.webdriver || /bot|crawl|spider|slurp|headless|preview|scan|monitor|python|curl|wget/i.test(ua);
  }
  function count(key, code) {
    if (!/^[a-z2-7]{12}$/.test(key) || looksAutomated()) return false;
    var url = COUNTER + '?p=' + encodeURIComponent('click/' + key) + '&e=true&t=' + encodeURIComponent(code)
      + '&rnd=' + Math.random().toString(36).slice(2);
    try { if (navigator.sendBeacon && navigator.sendBeacon(url)) return false; } catch (e) {}
    try { new Image().src = url; return true; } catch (e) { return false; }
  }

  var code = param('d'), dest = destination(code);
  if (!dest) {
    document.getElementById('h').textContent = 'Link not recognised';
    document.getElementById('bad').hidden = false;
    return;
  }
  var link = document.getElementById('link');
  link.href = dest;
  document.getElementById('go').hidden = false;
  var waitForImage = count(param('k'), code);
  setTimeout(function () { location.replace(dest); }, waitForImage ? 250 : 0);
})();
</script>
</body>
</html>
